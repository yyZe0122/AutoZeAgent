version: 2

project_name: autozeagent

builds:
  - id: autozeagent
    main: ./cmd/autozeagent
    binary: autozeagent
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X autozeagent.local/autozeagent/internal/version.Version={{ .Version }}
        -X autozeagent.local/autozeagent/internal/version.Commit={{ .Commit }}
        -X autozeagent.local/autozeagent/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: aze
    main: ./cmd/autozeagent
    binary: aze
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X autozeagent.local/autozeagent/internal/version.Version={{ .Version }}
        -X autozeagent.local/autozeagent/internal/version.Commit={{ .Commit }}
        -X autozeagent.local/autozeagent/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: autozeagentd
    main: ./cmd/autozeagentd
    binary: autozeagentd
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X autozeagent.local/autozeagent/internal/version.Version={{ .Version }}
        -X autozeagent.local/autozeagent/internal/version.Commit={{ .Commit }}
        -X autozeagent.local/autozeagent/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - ids:
      - autozeagent
      - aze
      - autozeagentd
    # Versioned names (must match packaging/scripts/install-*.{sh,ps1}).
    # Tag v0.1.0 → .Version is 0.1.0 (no leading v).
    name_template: "autozeagent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - src: configs/autozeagent.json.example
        dst: configs
        strip_parent: true
      - src: configs/autozeagent.schema.json
        dst: configs
        strip_parent: true
      - src: packaging/systemd/autozeagent.service
        dst: packaging/systemd
        strip_parent: true
      - src: packaging/scripts/*.sh
        dst: packaging/scripts
        strip_parent: true
      - src: packaging/scripts/*.ps1
        dst: packaging/scripts
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  name_template: "AutoZeAgent v{{ .Version }}"
  draft: false
  # Alpha first binary: mark Pre-release on GitHub.
  prerelease: true
  mode: replace

# Homebrew Cask + Scoop. Requires PACKAGE_GITHUB_TOKEN with Contents: R/W on
# yyZe0122/homebrew-tap and yyZe0122/scoop-bucket. Default GITHUB_TOKEN cannot
# push to other repos (Actions or local). GoReleaser v2: use homebrew_casks
# (legacy brews/formula is deprecated and fails `goreleaser check`).
homebrew_casks:
  - name: autozeagent
    repository:
      owner: yyZe0122
      name: homebrew-tap
      token: "{{ .Env.PACKAGE_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/yyZe0122/AutoZeAgent"
    description: "Local-first, policy-controlled automation agent"
    license: "Apache-2.0"
    # Paths inside the release archive (three production binaries).
    binaries:
      - autozeagent
      - autozeagentd
      - aze
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} {{ .Tag }}"
    # Skip upload for tags with prerelease markers (e.g. v1.0.0-rc1); plain v0.x still uploads.
    skip_upload: auto

scoops:
  - name: autozeagent
    repository:
      owner: yyZe0122
      name: scoop-bucket
      token: "{{ .Env.PACKAGE_GITHUB_TOKEN }}"
    # Root of bucket repo (Scoop lists manifests better without a subdir).
    homepage: "https://github.com/yyZe0122/AutoZeAgent"
    description: "Local-first, policy-controlled automation agent"
    license: "Apache-2.0"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} {{ .Tag }}"
    skip_upload: auto

# Body comes from CI: goreleaser ... --release-notes=docs/changelog/<tag>.md
changelog:
  disable: true
